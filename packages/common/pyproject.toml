[project]
name = "lrl-common"
version = "0.1.0"
description = "Code shared by LocalRithmicLLM services"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.10",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lrl_common"]
