[project]
name = "lrl-pipeline"
version = "0.1.0"
description = "LocalRithmicLLM pipeline service"
requires-python = ">=3.12"
dependencies = [
    "aiokafka[lz4]>=0.12",
    "asyncpg>=0.30",
    "lrl-common",
    "prometheus-client>=0.21",
]

[tool.uv.sources]
lrl-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lrl_pipeline"]
