[project]
name = "lrl-gateway"
version = "0.1.0"
description = "LocalRithmicLLM gateway service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "lrl-common",
    "uvicorn>=0.34",
]

[tool.uv.sources]
lrl-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lrl_gateway"]
